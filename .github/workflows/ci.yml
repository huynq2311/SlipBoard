name: SlipBoard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-validation:
    # The app targets macOS 26.5 and uses macOS 26 SDK APIs, which only ship
    # with Xcode 26.
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      # Builds by target rather than scheme: no shared scheme is committed, so
      # a scheme name is not guaranteed to exist on a fresh checkout.
      - name: Build
        run: |
          xcodebuild \
            -project SlipBoard.xcodeproj \
            -target SlipBoard \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
